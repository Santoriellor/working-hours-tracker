name: Deploy to Private Server

on:
  push:
    branches: [ main, security/phase-2e-tests ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Guard the ref here as well as in the trigger: if the trigger is ever
    # widened to run this workflow on a branch, this is what stops a feature
    # branch deploying to production.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copy project to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # .git is excluded deliberately: appleboy/scp-action has no exclude
          # input at any version, so it shipped the whole history every deploy.
          # data/ holds the live SQLite database and must never be overwritten
          # by whatever happens to be in the repo.
          rsync -avz \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "__pycache__" \
            --exclude "data" \
            ./ "$VPS_USER@$VPS_HOST:working-hours-tracker/"

      - name: Build and restart on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "
            set -e
            cd working-hours-tracker
            docker compose up -d --build
          "
