services:
  hours-tracker:
    build: .
    container_name: hours-tracker
    restart: unless-stopped
    volumes:
      - ./data:/data          # SQLite DB persisted here
    environment:
      - DB_PATH=/data/hours.db
    healthcheck:
      # python:3.12-slim has neither curl nor wget. uvicorn binds 8000.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.hours.rule=Host(`hours.santoriello.ch`)"
      - "traefik.http.routers.hours.entrypoints=websecure"
      - "traefik.http.routers.hours.tls.certresolver=le"
      # FastAPI listens on port 8000
      - "traefik.http.services.hours.loadbalancer.server.port=8000"
      # security-headers and gzip-compress live in Traefik's file provider
      # (dynamic/middlewares.yml); the @file suffix selects that provider.
      - "traefik.http.routers.hours.middlewares=security-headers@file,gzip-compress@file"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
