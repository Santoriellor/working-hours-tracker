version: "3.9"

services:
  hours-tracker:
    build: .
    container_name: hours-tracker
    restart: unless-stopped
    volumes:
      - ./data:/data          # SQLite DB persisted here
    environment:
      - DB_PATH=/data/hours.db
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.hours.rule=Host(`hours.santoriello.ch`)"
      - "traefik.http.routers.hours.entrypoints=websecure"
      - "traefik.http.routers.hours.tls.certresolver=le"
      # FastAPI listens on port 8000
      - "traefik.http.services.hours.loadbalancer.server.port=8000"
      # HTTP → HTTPS redirect router
      - "traefik.http.routers.santoriello-frontend-http.rule=Host(`hours.santoriello.ch`)"
      - "traefik.http.routers.santoriello-frontend-http.entrypoints=web"
      - "traefik.http.routers.santoriello-frontend-http.middlewares=redirect-to-https"
      # Middleware to redirect HTTP → HTTPS
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
